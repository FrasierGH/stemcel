# Stemcel CI gate.
#
# Runs on pushes to any branch except main, on pull requests, and on demand.
# A merge to main deliberately does NOT re-run it: main is only reachable
# through a pull request that already went green, so a post-merge run
# re-answers a settled question and costs Windows runner minutes for signal
# nobody acts on.
#
# The `pull_request` trigger earns its place on top of `push` by covering pull
# requests from forks, whose pushes never reach this repository. For a branch
# in this repository with an open pull request it does mean two runs per push;
# that is the accepted price of covering outside contributions. Narrow it to
# `types: [opened, reopened, ready_for_review]` if that ever outweighs it.
#
# Every job runs on Windows, the primary shipping platform, except
# `backend-macos`, which gates the macOS port's backend build and unit tests.
#
# The image is pinned to `windows-2022` rather than `windows-latest`, and the
# pin is load-bearing. `windows-latest` moved to Windows Server 2025 with
# Visual Studio 2026 in June 2026, which carries no VS 2022 instance, so a
# `Visual Studio 17 2022` generator cannot be found there. More importantly the
# toolchain that builds the shipping binaries is VS 2022, so a gate running a
# different MSVC would validate a compiler nobody releases from and could fail
# on findings a developer cannot reproduce.
#
# GitHub keeps `windows-2022` for a transition period only. When it retires,
# migrate the local toolchain first — install VS 2026, reconfigure, and clear
# whatever the newer MSVC and its headers report — then bump this image, the
# generator below, `.vscode/settings.json` and `scripts/Setup-Dev.ps1`
# together. Note that CMake refuses to reuse a build tree configured by a
# different generator, so the trees must be deleted as part of that move.
#
# The tiers are separate jobs so a failure names itself in the checks list —
# "Backend clang-tidy" is a more useful red than a single monolithic "CI" — and
# so the independent ones run in parallel. Only `e2e` has to wait, because it
# runs the backend the `backend` job built.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer commit makes the previous run's answer irrelevant. Push and pull
# request runs group separately because `github.ref` differs between them
# (`refs/heads/<branch>` vs the PR's merge ref).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned deliberately. -Strict turns warnings into errors, and different
  # clang-tidy releases disagree about what to warn on, so an unpinned runner
  # would fail the gate on findings a developer cannot reproduce. This is the
  # version the zero-warning baseline was established against.
  CLANG_TIDY_VERSION: "22.1.8"

jobs:
  backend:
    name: Backend build and unit tests
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      # The FetchContent dependencies (JUCE, Rubber Band, libsamplerate and the
      # rest) are a large download that changes only when CMakeLists.txt pins a
      # new revision, which is exactly the cache key.
      #
      # The image label is part of the key, and the fallback is scoped to it.
      # `_deps` holds *configured* sub-build trees that bake in an absolute path
      # to cl.exe, so a cache written on one image and restored onto another
      # points CMake at a compiler that is not there. That is not theoretical:
      # a cache saved on the VS 2026 image failed a later run here by demanding
      # `Visual Studio/18/.../14.51/cl.exe` on a VS 2022 runner.
      - uses: actions/cache@v6
        with:
          path: backend/build/_deps
          key: cmake-deps-vs-windows-2022-${{ hashFiles('backend/CMakeLists.txt') }}
          restore-keys: cmake-deps-vs-windows-2022-

      # rarewares.org (the only source of this build) is sometimes unreachable from the
      # runners; one successful fetch is cached for every later run.
      - name: Cache LAME
        uses: actions/cache@v6
        with:
          path: backend/third_party/lame/lame.exe
          key: lame-win-x64-3.100.1-${{ hashFiles('scripts/Fetch-Lame.ps1') }}
          restore-keys: lame-win-x64-3.100.1-

      # lame.exe is not in the repository, and CMake copies it next to the
      # backend at build time.
      - name: Fetch LAME (MP3 encoder/decoder)
        run: pwsh -NoProfile -File scripts/Fetch-Lame.ps1

      # Visual Studio generator, matching .vscode/settings.json and the
      # developer guide. It is multi-config, which is what the release build
      # needs, and CMake locates MSVC itself so no developer shell is required
      # here. Tests default to OFF, hence the explicit switch.
      #
      # The retry makes a stale dependency cache self-healing. Scoping the key
      # to the image stops the known cross-image case, but a Visual Studio
      # update *within* an image moves the compiler path too, and the resulting
      # error names a missing cl.exe rather than the cache that caused it.
      # Discarding the tree and configuring again turns that into a slower green
      # run instead of a baffling red one.
      - name: Configure
        run: |
          $configure = {
            cmake -S backend -B backend/build `
              -G "Visual Studio 17 2022" `
              -DSTEMCEL_BUILD_TESTS=ON
          }
          & $configure
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::warning::Configure failed; discarding the restored dependency cache and retrying from clean.'
            Remove-Item backend/build -Recurse -Force -ErrorAction SilentlyContinue
            & $configure
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Build
        run: cmake --build backend/build --config Debug --parallel

      # Two of the 399 tests drive the transport — one seeks and reads the
      # playhead back, the other asserts `play()` reaches `isPlaying()`. Neither
      # names a JUCE device class, so they look device-free, but the position
      # they check is advanced by the audio callback and a runner has no sound
      # hardware. Without this they fail, and they are worth keeping honest
      # rather than skipping.
      - name: Install a virtual audio device
        run: pwsh -NoProfile -File scripts/Install-VirtualAudioDevice.ps1

      - name: Unit tests
        run: ctest --test-dir backend/build --build-config Debug --output-on-failure

      # The native app (JUCE UI + engine in one process) drives itself through a
      # scripted journey: window up, engine ready, new project, add a track, save,
      # reopen. It is a GUI-subsystem executable, so wait on the process for its code.
      - name: Native app smoke test
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'native-smoke'
          $exe = 'backend/build/StemcelNative_artefacts/Debug/Stemcel.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test', "`"$dir`"" -Wait -PassThru
          Get-Content (Join-Path $dir 'smoke-result.txt') -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Write-Host "::error::Native smoke test exited $($p.ExitCode)"; exit 1 }

      # Handed to the e2e job so it runs the binary this job proved, and so the
      # backend is built once rather than twice. The directory is otherwise
      # self-contained — lame.exe and the MIDI mappings are
      # all copied beside the executable by POST_BUILD steps.
      #
      # The debug symbols are excluded deliberately: StemcelBackend.pdb alone
      # is around 840 MB, which would dominate the run in upload and download
      # time for a tier that never reads it.
      - name: Upload the backend build
        uses: actions/upload-artifact@v7
        with:
          name: backend-debug
          path: |
            backend/build/StemcelBackend_artefacts/Debug/
            !backend/build/StemcelBackend_artefacts/Debug/*.pdb
            !backend/build/StemcelBackend_artefacts/Debug/*.lib
            !backend/build/StemcelBackend_artefacts/Debug/*.exp
          retention-days: 1

  backend-lint:
    name: Backend linting
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Invoke-ClangTidy.ps1 prefers whatever `clang-tidy` is on PATH and only
      # falls back to the copy inside Visual Studio, whose version floats with
      # the runner image. Installing a pinned one first makes the choice
      # deterministic.
      - name: Install clang-tidy ${{ env.CLANG_TIDY_VERSION }}
        run: |
          pip install "clang-tidy==${{ env.CLANG_TIDY_VERSION }}"
          clang-tidy --version

      # Keyed and scoped to the image for the same reason as the build job: the
      # cached `_deps` sub-build trees bake in an absolute path to cl.exe, and
      # this is the job that a VS 2026-written cache actually broke.
      - uses: actions/cache@v6
        with:
          path: backend/build-release/_deps
          key: cmake-deps-ninja-windows-2022-${{ hashFiles('backend/CMakeLists.txt') }}
          restore-keys: cmake-deps-ninja-windows-2022-

      # rarewares.org (the only source of this build) is sometimes unreachable from the
      # runners; one successful fetch is cached for every later run.
      - name: Cache LAME
        uses: actions/cache@v6
        with:
          path: backend/third_party/lame/lame.exe
          key: lame-win-x64-3.100.1-${{ hashFiles('scripts/Fetch-Lame.ps1') }}
          restore-keys: lame-win-x64-3.100.1-

      - name: Fetch LAME (MP3 encoder/decoder)
        run: pwsh -NoProfile -File scripts/Fetch-Lame.ps1

      # clang-tidy reads compile_commands.json, which only the Ninja generator
      # emits — hence a second tree, and hence the developer shell, since Ninja
      # needs the MSVC environment that the VS generator supplies for itself.
      #
      # Configure alone is enough: nothing in this project generates a header
      # at build time (no JuceHeader.h includes, and every add_custom_command is
      # POST_BUILD), so compiling first would only cost minutes.
      #
      # The retry makes a stale dependency cache self-healing, as in the build
      # job — this is the exact failure that a VS 2026-written cache produced.
      - name: Configure the Ninja tree
        run: |
          $configure = {
            pwsh -NoProfile -File scripts/Invoke-DevShell.ps1 `
              "cmake -S backend -B backend/build-release -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_EXPORT_COMPILE_COMMANDS=ON"
          }
          & $configure
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::warning::Configure failed; discarding the restored dependency cache and retrying from clean.'
            Remove-Item backend/build-release -Recurse -Force -ErrorAction SilentlyContinue
            & $configure
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      # The developer shell puts Visual Studio's own LLVM ahead of everything
      # else on PATH, so the pinned binary loses unless it is named explicitly.
      # It is resolved here, outside the shell, and passed in. The echo is kept
      # because it is what caught the substitution in the first place: the gate
      # was silently running VS's clang-tidy 19 against a baseline established
      # with 22.
      - name: clang-tidy
        run: |
          $tidy = (Get-Command clang-tidy).Source
          Write-Host "Pinned clang-tidy: $tidy"
          pwsh -NoProfile -File scripts/Invoke-DevShell.ps1 `
            "pwsh -NoProfile -File scripts/Invoke-ClangTidy.ps1 -Strict -ClangTidyPath '$tidy'"

  # The macOS port's gate: the same backend build and unit tests on Apple
  # Silicon with Apple clang, which catches MSVC-only code and Windows-only
  # assumptions the jobs above cannot. Ninja is single-config, so the build
  # type is fixed at configure time and the artefacts land in
  # StemcelBackend_artefacts/Debug/ exactly where a dev launch looks.
  backend-macos:
    name: Backend build and unit tests (macOS)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: backend/build/_deps
          key: cmake-deps-ninja-macos-15-${{ hashFiles('backend/CMakeLists.txt') }}
          restore-keys: cmake-deps-ninja-macos-15-

      - name: Install Ninja
        run: brew install ninja

      - name: Build LAME (MP3 encoder/decoder)
        run: bash scripts/fetch-lame.sh

      - name: Configure
        run: |
          cmake -S backend -B backend/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DSTEMCEL_BUILD_TESTS=ON \
            || { echo '::warning::Configure failed; retrying from clean.'; rm -rf backend/build; \
                 cmake -S backend -B backend/build -G Ninja \
                   -DCMAKE_BUILD_TYPE=Debug -DSTEMCEL_BUILD_TESTS=ON; }

      # `-k 0` keeps compiling past a failure so one run reports every error.
      - name: Build
        run: cmake --build backend/build --parallel -- -k 0

      # Launch the engine on its own, the way Electron does, and require that it
      # is listening on the bridge port and still running seconds later. A broken
      # engine fails here in seconds, with its own log printed, instead of after
      # an hour of journeys timing out against it.
      - name: Smoke-launch the engine
        run: |
          # smoke <name> [ENV=value...]: launch, probe, report; returns 0 when healthy.
          smoke() {
            local name=$1; shift
            local log_dir="$RUNNER_TEMP/engine-smoke-$name"
            mkdir -p "$log_dir"
            env "$@" STEMCEL_LOG_DIR="$log_dir" STEMCEL_BRIDGE_TOKEN=smoke \
              backend/build/StemcelBackend_artefacts/Debug/StemcelBackend --port 8799 \
              > "$log_dir/stdio.txt" 2>&1 < /dev/null &
            local pid=$! listening=0 alive=0 status=0
            for _ in $(seq 1 30); do
              if nc -z 127.0.0.1 8799 2>/dev/null; then listening=1; break; fi
              kill -0 "$pid" 2>/dev/null || break
              sleep 1
            done
            sleep 5
            if kill -0 "$pid" 2>/dev/null; then alive=1; fi
            kill "$pid" 2>/dev/null || true
            wait "$pid" || status=$?
            echo "===== $name: listening=$listening alive_after_5s=$alive exit_status=$status"
            cat "$log_dir/stdio.txt"
            grep -E "startup complete|shutdown complete" "$log_dir/backend.log" || true
            [ "$listening" = 1 ] && [ "$alive" = 1 ]
          }
          smoke default

      - name: Native app smoke test
        run: |
          dir="$RUNNER_TEMP/native-smoke"
          status=0
          backend/build/StemcelNative_artefacts/Debug/Stemcel.app/Contents/MacOS/Stemcel \
            --smoke-test "$dir" || status=$?
          cat "$dir/smoke-result.txt" 2>/dev/null || true
          if [ "$status" -ne 0 ]; then echo "::error::Native smoke test exited $status"; exit 1; fi

      - name: Unit tests
        run: ctest --test-dir backend/build --output-on-failure
